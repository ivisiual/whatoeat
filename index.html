<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="今日宜 — 根据今天的状态，推荐一件值得做的小事" />
  <meta name="theme-color" content="#FF6B57" />
  <title>今日宜</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/home.css" />
  <link rel="stylesheet" href="./assets/css/responsive.css" />
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="page">
    <div class="app-nav" id="appNav"></div>

    <header class="home-hero">
      <div class="home-hero-top">
        <div>
          <h1>今日宜</h1>
          <p class="home-sub">先选今天的状态，再做一件刚刚好的小事</p>
        </div>
        <div class="home-date" id="homeDate">—</div>
      </div>
    </header>

    <section class="state-section" aria-label="今日状态">
      <span class="section-label">今天怎么过？</span>
      <div class="state-scroll" id="stateRow" role="listbox" aria-label="状态选择"></div>
      <p class="hint" id="stateHint">选一个状态，生成今日主签</p>
    </section>

    <div class="progress-card" aria-label="今日进度">
      <div class="progress-text" id="todayProgress">今日宜完成 0 / 0</div>
      <div class="progress-bar" aria-hidden="true">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <div class="home-toolbar">
      <button type="button" class="btn btn-secondary" id="btnRerollPlan">换一批建议</button>
      <a class="btn btn-ghost" href="./eat.html">宜吃饭 · 三餐</a>
    </div>

    <div id="homeSoften" class="soften-banner" hidden></div>

    <div class="yi-grid">
      <section aria-label="今日主签">
        <div id="mainSign"></div>
      </section>
      <section class="side-col" aria-label="顺手建议">
        <div class="section-head">
          <h2>顺手建议</h2>
        </div>
        <div id="sideSigns"></div>
      </section>
    </div>

    <section class="state-section" aria-label="进入模块">
      <span class="section-label">想自己挑模块？</span>
      <div class="mod-links" id="moduleLinks"></div>
    </section>

    <footer class="site-footer">
      <p>数据仅存本机 · 热量为估算 · 活动文案为原创测试种子</p>
      <p>今日宜 · 纯静态 · GitHub Pages 可部署</p>
    </footer>
  </div>

  <div class="toast-host" aria-live="assertive" aria-atomic="true">
    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="./js/core/utils.js"></script>
  <script src="./js/core/storage.js"></script>
  <script src="./js/core/navigation.js"></script>
  <script src="./js/core/recommendation.js"></script>
  <script src="./js/core/history.js"></script>
  <script src="./js/core/daily-plan.js"></script>
  <script src="./data/draw-prompts.js"></script>
  <script src="./data/study-actions.js"></script>
  <script src="./data/leisure-activities.js"></script>
  <script src="./data/bead-patterns.js"></script>
  <script src="./data/activity-pool.js"></script>
  <script src="./js/modules/home.js"></script>
</body>
</html>
