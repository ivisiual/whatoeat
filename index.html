<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="饭饭搭子 — 替选择困难的你，认真想好今天三顿饭" />
  <meta name="theme-color" content="#FF6B57" />
  <title>饭饭搭子 · 今天吃什么</title>
  <style>
    /* =========================================================
       饭饭搭子 · styles
       分区：变量 / 重置 / 布局 / 筛选 / 卡片 / 抽屉 / 动画
       ========================================================= */
    :root {
      --cream: #FFF8EE;
      --cream-deep: #F5EBD9;
      --tomato: #FF6B57;
      --tomato-deep: #E85540;
      --yolk: #FFC857;
      --yolk-soft: #FFE4A3;
      --avocado: #87B974;
      --avocado-deep: #6FA05C;
      --caramel: #6E4B3A;
      --caramel-soft: #A67C68;
      --ink: #3D2B22;
      --ink-soft: #6B5348;
      --line: rgba(110, 75, 58, 0.14);
      --shadow: 0 10px 28px rgba(110, 75, 58, 0.12);
      --shadow-soft: 0 4px 14px rgba(110, 75, 58, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
              "Noto Sans SC", "Segoe UI", system-ui, -apple-system, sans-serif;
      --space-page: clamp(12px, 3vw, 32px);
      --panel-padding: clamp(14px, 2vw, 24px);
      --title-size: clamp(1.25rem, 2.5vw, 2rem);
      --card-gap: clamp(12px, 2vw, 20px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --transition: 0.22s cubic-bezier(0.34, 1.2, 0.64, 1);
      --breakfast: #FFC857;
      --lunch: #FF6B57;
      --dinner: #87B974;
      --touch: 44px;
      --sticky-h: 0px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; min-width: 320px; font-family: var(--font);
      color: var(--ink); background: var(--cream); line-height: 1.55;
    }
    button, input { font: inherit; color: inherit; }
    a { color: var(--tomato-deep); }
    :focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    [hidden] { display: none !important; }

    .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; opacity: 0.5; }
    .blob-a {
      width: 220px; height: 220px; top: -60px; right: -40px;
      background: radial-gradient(circle at 30% 30%, var(--yolk-soft), transparent 70%);
    }
    .blob-b {
      width: 280px; height: 280px; bottom: 8%; left: -100px;
      background: radial-gradient(circle at 60% 40%, rgba(135,185,116,0.35), transparent 70%);
    }
    .blob-c {
      width: 150px; height: 150px; top: 40%; right: 5%;
      background: radial-gradient(circle at 40% 40%, rgba(255,107,87,0.16), transparent 70%);
    }

    .page {
      position: relative; z-index: 1;
      width: min(calc(100% - 2 * var(--space-page)), 1280px);
      margin-inline: auto;
      padding: clamp(12px, 2vw, 20px) 0 calc(1.5rem + var(--safe-b) + var(--sticky-h));
    }

    .site-header {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 0.6rem 1rem;
      margin-bottom: clamp(0.75rem, 2vw, 1.2rem);
      min-width: 0;
    }
    .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; flex: 1 1 auto; }
    .brand-mark {
      width: clamp(42px, 8vw, 52px); height: clamp(42px, 8vw, 52px); border-radius: 16px;
      background: linear-gradient(145deg, var(--tomato), #FF8F7A);
      box-shadow: var(--shadow-soft);
      display: grid; place-items: center; font-size: clamp(1.3rem, 3vw, 1.6rem);
      transform: rotate(-6deg);
      border: 2px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-text h1 { margin: 0; font-size: var(--title-size); color: var(--caramel); line-height: 1.2; }
    .brand-text p { margin: 0.15rem 0 0; font-size: clamp(0.75rem, 1.6vw, 0.85rem); color: var(--ink-soft); }
    .header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; min-width: 0; }
    .header-meta {
      text-align: right; background: rgba(255,255,255,0.7);
      border: 1.5px solid var(--line); border-radius: var(--radius-md);
      padding: 0.4rem 0.7rem; box-shadow: var(--shadow-soft); min-width: 0; max-width: 100%;
    }
    .header-meta .date { font-size: 0.86rem; font-weight: 600; color: var(--caramel); white-space: nowrap; }
    .header-meta .greet { margin-top: 0.1rem; font-size: 0.76rem; color: var(--ink-soft); max-width: 14rem; }
    .btn-icon {
      width: var(--touch); height: var(--touch); min-height: var(--touch);
      border-radius: 14px; padding: 0; display: inline-grid; place-items: center;
      font-size: 1.15rem; flex-shrink: 0;
    }

    .layout {
      display: flex; flex-direction: column;
      gap: clamp(14px, 2vw, 22px); min-width: 0;
    }

    .panel {
      background: rgba(255,255,255,0.82);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: var(--panel-padding);
      position: relative;
      min-width: 0; max-width: 100%;
    }
    .panel-title {
      margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--caramel);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .panel-title .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--tomato);
      box-shadow: 0 0 0 3px rgba(255,107,87,0.2);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 18px;
      min-width: 0;
    }
    .filter-block { margin: 0; min-width: 0; max-width: 100%; }
    .filter-block--span2 { grid-column: span 2; min-width: 0; }
    .filter-block--span4 { grid-column: 1 / -1; min-width: 0; }
    .filter-label {
      display: block; font-size: 0.76rem; font-weight: 700;
      color: var(--caramel-soft); margin-bottom: 0.4rem; letter-spacing: 0.02em;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; max-width: 100%; }
    .chip {
      appearance: none; border: 1.5px solid var(--line); background: #fff;
      border-radius: var(--radius-pill); padding: 0.45rem 0.75rem;
      min-height: var(--touch); min-width: 0; max-width: 100%;
      font-size: 0.8rem; cursor: pointer; color: var(--ink-soft);
      white-space: nowrap;
      transition: transform var(--transition), background var(--transition),
                  border-color var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .chip:hover { border-color: var(--caramel-soft); color: var(--caramel); transform: translateY(-1px); }
    .chip:active { transform: translateY(1px) scale(0.97); }
    .chip[aria-checked="true"], .chip[aria-pressed="true"] {
      background: var(--yolk); border-color: #E8B040; color: var(--caramel);
      font-weight: 700; box-shadow: 0 2px 0 #E0A830;
    }
    .chip.tag-chip[aria-pressed="true"] {
      background: #FDECEA; border-color: var(--tomato); color: var(--tomato-deep); box-shadow: none;
    }

    .cond-block {
      background: var(--cream); border: 1.5px dashed var(--line);
      border-radius: var(--radius-md); padding: 0.65rem 0.7rem; margin-bottom: 0.75rem;
    }
    .cond-block .filter-label { color: var(--caramel); }

    details.advanced {
      border: 1.5px solid var(--line); border-radius: var(--radius-md);
      background: #fff; margin-bottom: 0.85rem; overflow: hidden;
    }
    details.advanced > summary {
      cursor: pointer; list-style: none; padding: 0.65rem 0.8rem;
      font-size: 0.82rem; font-weight: 700; color: var(--caramel);
      display: flex; align-items: center; justify-content: space-between;
    }
    details.advanced > summary::-webkit-details-marker { display: none; }
    details.advanced > summary::after { content: "▾"; color: var(--caramel-soft); transition: transform 0.2s; }
    details.advanced[open] > summary::after { transform: rotate(180deg); }
    details.advanced .adv-body { padding: 0 0.75rem 0.75rem; }

    .filter-actions {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1rem; margin-top: 1rem; min-width: 0;
    }
    .filter-actions .hint { margin: 0; flex: 1 1 12rem; min-width: 0; font-size: 0.78rem; color: var(--ink-soft); }
    .filter-actions .btn-primary { width: auto; min-width: min(280px, 100%); flex: 0 1 280px; }
    .filter-summary {
      display: none; align-items: center; justify-content: space-between; gap: 0.75rem; min-width: 0;
    }
    .filter-summary-text {
      font-size: 0.88rem; color: var(--caramel); font-weight: 600; min-width: 0; flex: 1;
      overflow-wrap: anywhere;
    }
    .panel-controls.is-collapsed .filter-full { display: none; }
    .panel-controls.is-collapsed .filter-summary { display: flex; }
    .panel-controls.is-collapsed .filter-actions { display: none; }
    .soften-banner {
      background: linear-gradient(135deg, #FFF6E8, #F3F9EE);
      border: 1.5px solid rgba(135,185,116,0.4);
      border-radius: var(--radius-md); padding: 0.65rem 0.85rem;
      font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.85rem; min-width: 0;
    }
    .soften-banner strong { color: var(--avocado-deep); }
    .sticky-cta {
      display: none; position: sticky; bottom: calc(12px + var(--safe-b));
      z-index: 30; margin-top: 0.5rem;
    }
    .sticky-cta .btn-primary {
      width: 100%;
      box-shadow: 0 5px 0 var(--tomato-deep), 0 12px 28px rgba(255,107,87,0.35);
    }

    .btn {
      appearance: none; border: none; cursor: pointer;
      border-radius: var(--radius-pill); padding: 0.65rem 1.05rem;
      min-height: var(--touch);
      font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
      gap: 0.35rem; text-decoration: none; line-height: 1.2; max-width: 100%;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), opacity var(--transition);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(3px) scale(0.98); box-shadow: none !important; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }
    .btn-primary {
      width: 100%; background: linear-gradient(180deg, #FF7A68, var(--tomato));
      color: #fff; font-size: 0.96rem; padding: 0.85rem 1rem;
      box-shadow: 0 5px 0 var(--tomato-deep), 0 10px 20px rgba(255,107,87,0.28);
    }
    .btn-primary:hover { box-shadow: 0 7px 0 var(--tomato-deep), 0 12px 22px rgba(255,107,87,0.32); }
    .btn-primary:active { box-shadow: 0 2px 0 var(--tomato-deep) !important; transform: translateY(4px) scale(0.99); }
    .btn-secondary {
      background: #fff; color: var(--caramel); border: 1.5px solid var(--line);
      box-shadow: 0 3px 0 rgba(110,75,58,0.12); font-size: 0.82rem; font-weight: 600;
    }
    .btn-secondary:hover { border-color: var(--caramel-soft); box-shadow: 0 4px 0 rgba(110,75,58,0.14); }
    .btn-secondary:active { box-shadow: 0 1px 0 rgba(110,75,58,0.12) !important; }
    .btn-ghost {
      background: transparent; color: var(--ink-soft); border: 1.5px dashed var(--line);
      font-size: 0.8rem; font-weight: 600;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.7); border-style: solid; color: var(--caramel); }
    .btn-sm { padding: 0.45rem 0.7rem; font-size: 0.8rem; border-radius: var(--radius-sm); min-height: var(--touch); }
    .btn-link {
      background: var(--cream-deep); color: var(--caramel); border: 1.5px solid var(--line);
      box-shadow: none; font-size: 0.76rem; font-weight: 600;
    }
    .btn-link:hover { background: var(--yolk-soft); border-color: #E8B040; }
    .btn-eaten {
      background: linear-gradient(180deg, #9BCB84, var(--avocado));
      color: #fff; border: none;
      box-shadow: 0 3px 0 var(--avocado-deep);
      font-size: 0.82rem; font-weight: 700;
    }
    .btn-eaten:hover { box-shadow: 0 4px 0 var(--avocado-deep); }
    .btn-eaten:active { box-shadow: 0 1px 0 var(--avocado-deep) !important; }
    .btn-danger {
      background: #fff; color: var(--tomato-deep); border: 1.5px solid rgba(255,107,87,0.4);
      font-size: 0.78rem; font-weight: 600;
    }

    .hint { margin: 0.65rem 0 0; font-size: 0.74rem; color: var(--ink-soft); line-height: 1.45; }
    .side-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }

    .results-head {
      display: flex; flex-wrap: wrap; align-items: flex-start;
      justify-content: space-between; gap: 0.5rem; margin-bottom: 0.85rem;
    }
    .results-head h2 { margin: 0; font-size: 1.05rem; color: var(--caramel); }
    .results-sub { margin: 0.15rem 0 0; font-size: 0.8rem; color: var(--ink-soft); }

    .meal-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--card-gap);
      min-width: 0;
    }
    .meal-card {
      background: #fff; border: 1.5px solid var(--line);
      border-radius: var(--radius-lg); padding: clamp(0.75rem, 1.5vw, 0.95rem);
      box-shadow: var(--shadow-soft); position: relative; overflow: hidden;
      min-width: 0; max-width: 100%;
      opacity: 0; transform: translateY(14px) scale(0.98);
      display: flex; flex-direction: column;
    }
    .meal-card.is-shown {
      opacity: 1; transform: none;
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .meal-card::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    }
    .meal-card[data-meal="breakfast"]::after { background: linear-gradient(90deg, #FFD56A, var(--breakfast)); }
    .meal-card[data-meal="lunch"]::after { background: linear-gradient(90deg, #FF8F7A, var(--lunch)); }
    .meal-card[data-meal="dinner"]::after { background: linear-gradient(90deg, #A8D08E, var(--dinner)); }
    .meal-card[data-meal="breakfast"] { background: linear-gradient(180deg, #FFFCF3 0%, #fff 40%); }
    .meal-card[data-meal="lunch"] { background: linear-gradient(180deg, #FFF7F5 0%, #fff 40%); }
    .meal-card[data-meal="dinner"] { background: linear-gradient(180deg, #F7FBF4 0%, #fff 40%); }
    .meal-card.is-placeholder {
      opacity: 1; transform: none; min-height: 120px;
      display: flex; flex-direction: row; align-items: center; gap: 0.85rem;
      border-style: dashed;
    }
    .meal-card.is-placeholder .ph-emoji {
      width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center;
      font-size: 1.6rem; background: var(--cream); border: 1.5px solid var(--line); flex-shrink: 0;
    }
    .meal-card.is-placeholder .ph-text strong { display: block; color: var(--caramel); font-size: 0.95rem; }
    .meal-card.is-placeholder .ph-text span { font-size: 0.8rem; color: var(--ink-soft); }
    .meal-card.is-swapping { animation: cardSwap 0.4s ease; }

    .buddy {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 0.2rem 0 0.9rem; padding: 0.75rem 0.85rem;
      background: linear-gradient(135deg, #FFF4E8, #F0F8EA);
      border: 1.5px solid var(--line); border-radius: var(--radius-md);
    }
    .buddy-face {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, var(--yolk-soft));
      border: 2px solid rgba(255,200,87,0.6);
      display: grid; place-items: center; font-size: 1.7rem; flex-shrink: 0;
      box-shadow: var(--shadow-soft);
    }
    .buddy-text { font-size: 0.84rem; color: var(--ink-soft); }
    .buddy-text strong { color: var(--caramel); }

    .meal-top { display: flex; gap: 0.8rem; align-items: flex-start; }
    .food-visual {
      flex: 0 0 auto; width: 62px; height: 62px; border-radius: 20px;
      background: var(--cream); border: 1.5px solid var(--line);
      display: grid; place-items: center; font-size: 1.9rem; position: relative; overflow: hidden;
    }
    .food-visual .plate {
      position: absolute; inset: 10px; border-radius: 50%;
      border: 2px solid rgba(110,75,58,0.08);
      background: radial-gradient(circle at 35% 30%, #fff, var(--cream-deep));
    }
    .food-visual .emoji { position: relative; z-index: 1; }
    .meal-info { flex: 1; min-width: 0; }
    .meal-badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.7rem; font-weight: 700; color: var(--caramel-soft);
      background: rgba(255,255,255,0.8); border-radius: var(--radius-pill);
      padding: 0.12rem 0.5rem; border: 1px solid var(--line); margin-bottom: 0.28rem;
    }
    .channel-pill {
      display: inline-block; margin-left: 0.25rem; font-size: 0.68rem;
      padding: 0.08rem 0.4rem; border-radius: var(--radius-pill);
      background: var(--cream-deep); color: var(--caramel); font-weight: 600;
    }
    .meal-name { margin: 0; font-size: 1.1rem; color: var(--ink); line-height: 1.3; word-break: break-word; }
    .meal-reason { margin: 0.3rem 0 0; font-size: 0.82rem; color: var(--ink-soft); }

    .meta-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.38rem; margin: 0.8rem 0 0.65rem;
    }
    @media (min-width: 520px) {
      .meta-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .meta-item {
      background: rgba(255,248,238,0.85); border-radius: var(--radius-sm);
      padding: 0.38rem 0.48rem; border: 1px solid var(--line); min-width: 0;
    }
    .meta-item .k { display: block; font-size: 0.66rem; color: var(--caramel-soft); }
    .meta-item .v {
      display: block; font-size: 0.8rem; font-weight: 600; color: var(--caramel);
      margin-top: 0.05rem; word-break: break-word;
    }
    .tip-box {
      background: linear-gradient(135deg, #FFF9EF, #F3F9EE);
      border: 1.5px dashed rgba(135,185,116,0.45);
      border-radius: var(--radius-md); padding: 0.5rem 0.65rem;
      font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.65rem;
    }
    .tip-box strong { color: var(--avocado-deep); }
    .search-row {
      font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 0.65rem;
      display: flex; flex-wrap: wrap; gap: 0.25rem 0.45rem; align-items: center;
    }
    .search-row code {
      background: var(--cream-deep); border-radius: 6px; padding: 0.1rem 0.38rem;
      font-family: ui-monospace, Consolas, monospace; font-size: 0.74rem; color: var(--caramel);
    }
    .card-actions {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem; margin-top: auto; padding-top: 0.35rem;
    }
    .card-actions .btn, .card-actions a.btn { width: 100%; min-width: 0; }
    .card-actions .btn-full { grid-column: 1 / -1; }

    .bottom-actions {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      margin-top: 0.95rem; padding-top: 0.85rem; border-top: 1.5px dashed var(--line);
    }
    .bottom-actions .btn { flex: 1 1 auto; min-width: 7.2rem; }

    .no-match {
      background: #FFF4F1; border: 1.5px solid rgba(255,107,87,0.35);
      border-radius: var(--radius-md); padding: clamp(1rem, 3vw, 1.4rem);
      text-align: center; width: 100%; min-width: 0; grid-column: 1 / -1;
    }
    .no-match h3 { margin: 0 0 0.35rem; color: var(--tomato-deep); font-size: 0.96rem; }
    .no-match p { margin: 0 0 0.75rem; font-size: 0.84rem; color: var(--ink-soft); }

    /* 历史抽屉 */
    .drawer-mask {
      position: fixed; inset: 0; background: rgba(61,43,34,0.35);
      z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .drawer-mask.is-open { opacity: 1; pointer-events: auto; }
    .history-drawer {
      position: fixed; z-index: 45; background: var(--cream);
      box-shadow: var(--shadow); display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.34, 1.1, 0.64, 1);
    }
    @media (min-width: 768px) {
      .history-drawer {
        top: 0; right: 0; bottom: 0; width: min(400px, 92vw);
        transform: translateX(105%); border-left: 1.5px solid var(--line);
      }
      .history-drawer.is-open { transform: translateX(0); }
    }
    @media (max-width: 767px) {
      .history-drawer {
        left: 0; right: 0; bottom: 0;
        height: min(88dvh, 100%); max-height: 100dvh;
        border-radius: 20px 20px 0 0; transform: translateY(105%);
        padding-bottom: var(--safe-b);
      }
      .history-drawer.is-open { transform: translateY(0); }
      .history-drawer .drawer-handle {
        width: 40px; height: 4px; border-radius: 4px; background: var(--line);
        margin: 0.55rem auto 0.2rem;
      }
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; padding: 0.9rem 1rem 0.55rem; border-bottom: 1.5px solid var(--line);
    }
    .drawer-head h2 { margin: 0; font-size: 1rem; color: var(--caramel); }
    .drawer-tabs {
      display: flex; gap: 0.35rem; padding: 0.65rem 1rem 0;
    }
    .drawer-tabs .chip { font-size: 0.76rem; }
    .drawer-body {
      flex: 1; overflow: auto; padding: 0.7rem 1rem 1rem;
      -webkit-overflow-scrolling: touch;
    }
    .hist-item {
      background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius-md);
      padding: 0.65rem 0.7rem; margin-bottom: 0.5rem;
    }
    .hist-item .hist-top {
      display: flex; justify-content: space-between; gap: 0.4rem; align-items: flex-start;
      margin-bottom: 0.3rem;
    }
    .hist-item .hist-time { font-size: 0.78rem; font-weight: 700; color: var(--caramel); }
    .hist-item .hist-action {
      font-size: 0.7rem; font-weight: 600; color: var(--tomato-deep);
      background: #FDECEA; border-radius: var(--radius-pill); padding: 0.1rem 0.45rem;
      white-space: nowrap;
    }
    .hist-item .hist-names { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.4; }
    .hist-item .hist-actions {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem;
    }
    .drawer-foot {
      padding: 0.65rem 1rem calc(0.85rem + var(--safe-b));
      border-top: 1.5px solid var(--line); background: rgba(255,248,238,0.95);
    }

    .toast-host {
      position: fixed; left: 50%; bottom: calc(1.2rem + var(--safe-b) + var(--sticky-h));
      transform: translateX(-50%); z-index: 60; width: min(92vw, 360px); pointer-events: none;
    }
    .toast {
      background: var(--caramel); color: #fff; padding: 0.7rem 1rem;
      border-radius: var(--radius-md); box-shadow: var(--shadow);
      font-size: 0.86rem; text-align: center; opacity: 0;
      transform: translateY(12px); transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.is-on { opacity: 1; transform: translateY(0); }

    .site-footer {
      margin-top: 1.4rem; text-align: center; font-size: 0.74rem;
      color: var(--caramel-soft); line-height: 1.6; padding: 0 0.5rem;
    }
    .site-footer a { color: var(--caramel); }

    @keyframes cardSwap {
      0% { transform: scale(1); }
      40% { transform: scale(0.96) rotateY(8deg); opacity: 0.65; }
      100% { transform: scale(1) rotateY(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .meal-card { opacity: 1; transform: none; }
      .btn:hover, .chip:hover { transform: none; }
      .history-drawer, .drawer-mask { transition: none; }
    }
    /* Tablet */
    @media (max-width: 1023px) {
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-block--span2 { grid-column: 1 / -1; }
      .meal-list { grid-template-columns: 1fr; }
      .filter-actions .btn-primary { flex: 1 1 100%; width: 100%; min-width: 0; }
      .meta-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* Phone */
    @media (max-width: 767px) {
      :root { --sticky-h: 72px; }
      .header-meta {
        padding: 0.2rem 0; background: none; border: none; box-shadow: none;
      }
      .header-meta .date { font-size: 0.72rem; }
      .header-meta .greet { display: none; }
      .brand-text p { display: none; }
      .filter-grid { grid-template-columns: 1fr; gap: 12px; }
      .filter-block--span2 { grid-column: auto; }
      .filter-mobile-collapse { display: none; }
      .panel-controls:not(.is-collapsed) .more-panel { display: block; }
      .filter-actions { display: none; }
      .sticky-cta { display: block; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bottom-actions .btn { min-width: calc(50% - 0.3rem); }
    }

    @media (min-width: 768px) {
      .more-panel { display: none !important; }
      .sticky-cta { display: none !important; }
      .filter-mobile-collapse { display: block; }
    }

    details.more-panel {
      border: 1.5px solid var(--line); border-radius: var(--radius-md);
      background: #fff; margin-top: 12px; overflow: hidden; min-width: 0;
    }
    details.more-panel > summary {
      cursor: pointer; list-style: none; padding: 0.7rem 0.85rem;
      min-height: var(--touch); font-size: 0.84rem; font-weight: 700; color: var(--caramel);
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    details.more-panel > summary::-webkit-details-marker { display: none; }
    details.more-panel > summary::after { content: "▾"; color: var(--caramel-soft); }
    details.more-panel[open] > summary::after { transform: rotate(180deg); }
    details.more-panel .more-body { padding: 0 0.85rem 0.9rem; display: grid; gap: 0.85rem; min-width: 0; }
  </style>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="page">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🍱</div>
        <div class="brand-text">
          <h1>饭饭搭子</h1>
          <p>替选择困难的你，认真想好今天三顿饭</p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-meta">
          <div class="date" id="todayDate">—</div>
          <div class="greet" id="greeting">你好呀</div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" id="btnOpenHistory" aria-haspopup="dialog" aria-label="历史记录" title="历史记录">📋</button>
      </div>
    </header>

    <main class="layout">
      <!-- 顶部筛选 -->
      <section class="panel panel-controls" id="filterPanel" aria-label="筛选与安排">
        <div class="filter-summary" id="filterSummary">
          <div class="filter-summary-text" id="filterSummaryText">—</div>
          <button type="button" class="btn btn-secondary btn-sm" id="btnEditFilters">修改</button>
        </div>

        <div class="filter-full" id="filterFull">
          <h2 class="panel-title"><span class="dot" aria-hidden="true"></span>今天怎么吃</h2>

          <div class="filter-grid" id="primaryFilters">
            <div class="filter-block">
              <span class="filter-label" id="labelScene">场景</span>
              <div class="chip-row" role="radiogroup" aria-labelledby="labelScene" id="sceneGroup">
                <button type="button" class="chip" data-scene="office" role="radio" aria-checked="true">在公司</button>
                <button type="button" class="chip" data-scene="home" role="radio" aria-checked="false">在家</button>
                <button type="button" class="chip" data-scene="overtime" role="radio" aria-checked="false">今天加班</button>
                <button type="button" class="chip" data-scene="post_workout" role="radio" aria-checked="false">刚运动完</button>
              </div>
            </div>
            <div class="filter-block">
              <span class="filter-label" id="labelGoal">饮食目标</span>
              <div class="chip-row" role="radiogroup" aria-labelledby="labelGoal" id="goalGroup">
                <button type="button" class="chip" data-goal="casual" role="radio" aria-checked="true">随心吃</button>
                <button type="button" class="chip" data-goal="light" role="radio" aria-checked="false">吃轻一点</button>
                <button type="button" class="chip" data-goal="high_protein" role="radio" aria-checked="false">高蛋白</button>
                <button type="button" class="chip" data-goal="ovo_lacto" role="radio" aria-checked="false">蛋奶素</button>
              </div>
            </div>
            <div class="filter-block">
              <span class="filter-label" id="labelChannel">用餐方式</span>
              <div class="chip-row" role="radiogroup" aria-labelledby="labelChannel" id="channelGroup">
                <button type="button" class="chip" data-channel="any" role="radio" aria-checked="true">都可以</button>
                <button type="button" class="chip" data-channel="canteen" role="radio" aria-checked="false">食堂</button>
                <button type="button" class="chip" data-channel="takeout" role="radio" aria-checked="false">外卖</button>
                <button type="button" class="chip" data-channel="convenience" role="radio" aria-checked="false">便利店</button>
                <button type="button" class="chip" data-channel="home_cook" role="radio" aria-checked="false">自己做</button>
              </div>
            </div>
          </div>

          <details class="more-panel" id="morePanel">
            <summary id="morePanelSummary">⚙️ 更多条件</summary>
            <div class="more-body" id="moreBody"></div>
          </details>

          <div class="filter-grid" id="secondaryFilters">
            <div class="filter-block">
              <span class="filter-label" id="labelHunger">胃口</span>
              <div class="chip-row" role="radiogroup" aria-labelledby="labelHunger" id="hungerGroup">
                <button type="button" class="chip" data-hunger="low" role="radio" aria-checked="false">没什么胃口</button>
                <button type="button" class="chip" data-hunger="normal" role="radio" aria-checked="true">正常</button>
                <button type="button" class="chip" data-hunger="starving" role="radio" aria-checked="false">非常饿</button>
              </div>
            </div>
            <div class="filter-block filter-block--span2">
              <span class="filter-label" id="labelTaste">口味（可多选）</span>
              <div class="chip-row" role="group" aria-labelledby="labelTaste" id="tasteGroup">
                <button type="button" class="chip" data-taste="hot" aria-pressed="false">热乎乎</button>
                <button type="button" class="chip" data-taste="refreshing" aria-pressed="false">清爽</button>
                <button type="button" class="chip" data-taste="spicy" aria-pressed="false">香辣</button>
                <button type="button" class="chip" data-taste="sweet_sour" aria-pressed="false">酸甜</button>
                <button type="button" class="chip" data-taste="soupy" aria-pressed="false">汤汤水水</button>
                <button type="button" class="chip" data-taste="rice_friendly" aria-pressed="false">特别下饭</button>
              </div>
            </div>
            <div class="filter-block">
              <span class="filter-label" id="labelBudget">预算</span>
              <div class="chip-row" role="radiogroup" aria-labelledby="labelBudget" id="budgetGroup">
                <button type="button" class="chip" data-budget="any" role="radio" aria-checked="true">不限制</button>
                <button type="button" class="chip" data-budget="under15" role="radio" aria-checked="false">15元以内</button>
                <button type="button" class="chip" data-budget="15to30" role="radio" aria-checked="false">15～30元</button>
                <button type="button" class="chip" data-budget="over30" role="radio" aria-checked="false">30元以上</button>
              </div>
            </div>
            <div class="filter-block filter-block--span2">
              <div class="cond-block" id="homeCookExtras" hidden>
                <div class="filter-block" style="margin-bottom:0.55rem">
                  <span class="filter-label" id="labelEquip">厨具</span>
                  <div class="chip-row" role="radiogroup" aria-labelledby="labelEquip" id="equipGroup">
                    <button type="button" class="chip" data-equip="any" role="radio" aria-checked="true">不限</button>
                    <button type="button" class="chip" data-equip="wok" role="radio" aria-checked="false">炒锅</button>
                    <button type="button" class="chip" data-equip="microwave" role="radio" aria-checked="false">微波炉</button>
                    <button type="button" class="chip" data-equip="rice_cooker" role="radio" aria-checked="false">电饭煲</button>
                    <button type="button" class="chip" data-equip="none" role="radio" aria-checked="false">几乎不用开火</button>
                  </div>
                </div>
                <div class="filter-block" style="margin-bottom:0">
                  <span class="filter-label" id="labelPrep">做饭时间</span>
                  <div class="chip-row" role="radiogroup" aria-labelledby="labelPrep" id="prepGroup">
                    <button type="button" class="chip" data-prep="any" role="radio" aria-checked="true">不着急</button>
                    <button type="button" class="chip" data-prep="10" role="radio" aria-checked="false">10 分钟</button>
                    <button type="button" class="chip" data-prep="20" role="radio" aria-checked="false">20 分钟</button>
                    <button type="button" class="chip" data-prep="30" role="radio" aria-checked="false">30 分钟</button>
                  </div>
                </div>
              </div>
              <div class="cond-block" id="takeoutExtras" hidden>
                <div class="filter-block" style="margin-bottom:0">
                  <span class="filter-label" id="labelWait">可接受等待</span>
                  <div class="chip-row" role="radiogroup" aria-labelledby="labelWait" id="waitGroup">
                    <button type="button" class="chip" data-wait="any" role="radio" aria-checked="true">不限</button>
                    <button type="button" class="chip" data-wait="20" role="radio" aria-checked="false">20 分钟内</button>
                    <button type="button" class="chip" data-wait="30" role="radio" aria-checked="false">30 分钟内</button>
                    <button type="button" class="chip" data-wait="45" role="radio" aria-checked="false">45 分钟内</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="filter-block filter-block--span2">
              <details class="advanced" id="advancedBox">
                <summary>再挑剔一点 · 忌口</summary>
                <div class="adv-body">
                  <div class="chip-row" role="group" aria-label="忌口" id="tagGroup">
                    <button type="button" class="chip tag-chip" data-tag="noSpicy" aria-pressed="false">不辣</button>
                    <button type="button" class="chip tag-chip" data-tag="noBeef" aria-pressed="false">不吃牛肉</button>
                    <button type="button" class="chip tag-chip" data-tag="noPork" aria-pressed="false">不吃猪肉</button>
                    <button type="button" class="chip tag-chip" data-tag="noSeafood" aria-pressed="false">不吃海鲜</button>
                    <button type="button" class="chip tag-chip" data-tag="noEgg" aria-pressed="false">不吃鸡蛋</button>
                    <button type="button" class="chip tag-chip" data-tag="noMilk" aria-pressed="false">不喝牛奶</button>
                    <button type="button" class="chip tag-chip" data-tag="noNuts" aria-pressed="false">不吃花生坚果</button>
                  </div>
                </div>
              </details>
            </div>
          </div>

          <div class="filter-actions">
            <p class="hint" id="modeHint">今天已经做了很多决定，吃什么就交给我吧。</p>
            <button type="button" class="btn btn-primary" id="btnArrange">帮我安排今天三顿饭</button>
          </div>
          <div class="side-tools">
            <button type="button" class="btn btn-ghost btn-sm" id="btnToggleFav" aria-expanded="false">我的收藏</button>
          </div>
          <div id="favPanel" hidden style="margin-top:0.7rem">
            <ul id="favList" style="list-style:none;margin:0;padding:0;display:grid;gap:0.4rem;max-height:180px;overflow:auto"></ul>
            <p class="hint" id="favEmpty" hidden>还没有收藏。</p>
          </div>
        </div>
      </section>

      <!-- 下方结果 -->
      <section class="panel panel-results" id="resultsPanel" aria-label="今日三餐" aria-live="polite">
        <div class="results-head">
          <div>
            <h2>今日菜单</h2>
            <p class="results-sub" id="resultsSub">选好条件后点主按钮，三顿饭会在这里揭晓</p>
          </div>
        </div>
        <div id="softenNotice" class="soften-banner" hidden></div>
        <div id="resultsArea"></div>
        <div class="bottom-actions" id="bottomActions" hidden>
          <button type="button" class="btn btn-secondary" id="btnRerollAll">全部换一组</button>
          <button type="button" class="btn btn-eaten" id="btnEatToday">今天就吃这套</button>
          <button type="button" class="btn btn-secondary" id="btnFavorite">收藏今天</button>
          <button type="button" class="btn btn-secondary" id="btnCopy">复制今日菜单</button>
        </div>
      </section>
    </main>

    <div class="sticky-cta" id="stickyCta">
      <button type="button" class="btn btn-primary" id="btnArrangeSticky">帮我安排今天三顿饭</button>
    </div>

    <footer class="site-footer">
      <p>热量为估算范围，仅供参考，不构成营养或医疗建议。</p>
      <p>
        自制菜谱优先链接
        <a href="https://github.com/Anduin2017/HowToCook" target="_blank" rel="noopener noreferrer">HowToCook</a>
        · 数据仅存本机
      </p>
    </footer>
  </div>

  <!-- 历史抽屉 -->
  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="history-drawer" id="historyDrawer" role="dialog" aria-modal="true" aria-labelledby="histTitle" hidden>

    <div class="drawer-head">

    </div>
    <div class="drawer-tabs" role="tablist">
      <button type="button" class="chip" id="tabRecommend" role="tab" aria-selected="true" aria-pressed="true">推荐历史</button>
      <button type="button" class="chip" id="tabEaten" role="tab" aria-selected="false" aria-pressed="false">真正吃过</button>

    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot">
      <button type="button" class="btn btn-danger btn-sm" id="btnClearHistory" style="width:100%">清空全部推荐历史</button>
    </div>
  </aside>

  <div class="toast-host" aria-live="assertive" aria-atomic="true">
    <div class="toast" id="toast" role="status"></div>
  </div>

  <script>

      if (h < 23) return "晚上吃轻一点，也要吃暖一点。";
      return "今天已经做了很多决定，吃什么交给我。";
    }

    function formatRelativeTime(ts) {
      var d = new Date(ts);
      var now = new Date();
      var hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var startThat = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      var dayDiff = Math.round((startToday - startThat) / 86400000);
      if (dayDiff === 0) return "今天 " + hm;
      if (dayDiff === 1) return "昨天 " + hm;
      if (dayDiff === 2) return "前天 " + hm;
      if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
      return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function toast(msg) {
      var el = $("#toast");
      el.textContent = msg;
      el.classList.add("is-on");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove("is-on"); }, 2200);
    }

    function safeJsonParse(raw, fallback) {
      try { return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
    }

    function recipeUrl(dish) {
      if (!dish || !dish.recipePath) return "";
      return HOWTOCOOK + dish.recipePath.split("/").map(encodeURIComponent).join("/");
    }

    function dishById(id) {
      for (var i = 0; i < DISHES.length; i++) if (DISHES[i].id === id) return DISHES[i];
      return null;
    }

    function makeSignature(meals) {
      return MEALS.map(function (m) { return meals[m] || ""; }).join("|");
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /* ---------- 4. 设置与历史 ---------- */
    function defaultSettings() {
      return {
        scene: "office",
        goal: "casual",
        channel: "any",
        hunger: "normal",
        tastes: [],
        budget: "any",
        equipment: "any",
        prepTime: "any",
        waitTime: "any",
        tags: {
          noSpicy: false, noBeef: false, noPork: false,
          noSeafood: false, noEgg: false, noMilk: false, noNuts: false
        }
      };
    }

    function loadSettings() {
      var def = defaultSettings();
      var s = safeJsonParse(localStorage.getItem(STORAGE.settings), def);
      return {
        scene: s.scene || def.scene,
        goal: s.goal || def.goal,
        channel: s.channel || def.channel,
        hunger: s.hunger || def.hunger,
        tastes: Array.isArray(s.tastes) ? s.tastes : [],
        budget: s.budget || def.budget,
        equipment: s.equipment || def.equipment,
        prepTime: s.prepTime || def.prepTime,
        waitTime: s.waitTime || def.waitTime,
        tags: Object.assign({}, def.tags, s.tags || {})
      };
    }

    function saveSettings(s) {
      localStorage.setItem(STORAGE.settings, JSON.stringify(s));
    }

    function snapshotFilters(s) {
      return JSON.parse(JSON.stringify(s));
    }

    function loadCurrentMenu() {
      return safeJsonParse(localStorage.getItem(STORAGE.currentMenu), null);
    }

    function saveCurrentMenu(menu) {
      localStorage.setItem(STORAGE.currentMenu, JSON.stringify(menu));
    }

    function pruneRecommend(list) {
      var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
      return (list || []).filter(function (h) {
        return h && h.ts && h.ts >= cutoff;
      }).slice(-100);
    }

    function loadRecommendHistory() {
      return pruneRecommend(safeJsonParse(localStorage.getItem(STORAGE.recommendHistory), []));
    }

    function saveRecommendHistory(list) {
      localStorage.setItem(STORAGE.recommendHistory, JSON.stringify(pruneRecommend(list)));
    }

    function loadEatenHistory() {
      var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
      return safeJsonParse(localStorage.getItem(STORAGE.eatenHistory), []).filter(function (h) {
        return h && h.ts && h.ts >= cutoff;
      }).slice(-100);
    }

    function saveEatenHistory(list) {
      localStorage.setItem(STORAGE.eatenHistory, JSON.stringify(list.slice(-100)));
    }

    function loadFavorites() {
      return safeJsonParse(localStorage.getItem(STORAGE.favorites), []);
    }

    function saveFavorites(list) {
      localStorage.setItem(STORAGE.favorites, JSON.stringify(list));
    }

    function hasArrangedBefore() {
      return localStorage.getItem(STORAGE.hasArranged) === "1";
    }

    function markArranged() {
      localStorage.setItem(STORAGE.hasArranged, "1");
    }

    function pushRecommendHistory(entry) {
      var list = loadRecommendHistory();
      list.push(entry);
      saveRecommendHistory(list);
    }

    function recentSignatures(n) {
      var list = loadRecommendHistory();
      var out = [];
      for (var i = list.length - 1; i >= 0 && out.length < n; i--) {
        if (list[i].signature) out.push(list[i].signature);
      }
      return out;
    }

    function recentMealDishIds(meal, n) {
      var list = loadRecommendHistory();
      var ids = [];
      var seen = {};
      for (var i = list.length - 1; i >= 0 && ids.length < n; i--) {
        var id = list[i].meals && list[i].meals[meal];
        if (id && !seen[id]) {
          seen[id] = true;
          ids.push(id);
        }
      }
      return ids;
    }

    function eatenDishWeightMap() {
      var list = loadEatenHistory();
      var map = {};
      var cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
      list.forEach(function (h) {
        if (!h.ts || h.ts < cutoff || !h.meals) return;
        MEALS.forEach(function (m) {
          var id = h.meals[m];
          if (id) map[id] = (map[id] || 0) + 1;
        });
      });
      return map;
    }

    /* ---------- 5. 筛选与引擎（硬条件 + 软偏好） ---------- */
    var TASTE_LABEL = {
      hot: "热乎乎", refreshing: "清爽", spicy: "香辣",
      sweet_sour: "酸甜", soupy: "汤汤水水", rice_friendly: "特别下饭"
    };
    var GOAL_LABEL = { casual: "随心吃", light: "吃轻一点", high_protein: "高蛋白", ovo_lacto: "蛋奶素" };
    var SCENE_LABEL = { office: "在公司", home: "在家", overtime: "今天加班", post_workout: "刚运动完" };
    var HUNGER_LABEL = { low: "没什么胃口", normal: "正常", starving: "非常饿" };
    var BUDGET_LABEL = { any: "不限制", under15: "15元以内", "15to30": "15～30元", over30: "30元以上" };

    /** 硬筛选：忌口/过敏、蛋奶素、明确用餐方式、厨具、预算上限、餐次 */
    function matchHardFilters(dish, settings, meal) {
      if (meal && dish.meals.indexOf(meal) === -1) return false;

      if (settings.channel !== "any" && dish.channels.indexOf(settings.channel) === -1) return false;

      var bOrder = { under15: 1, "15to30": 2, over30: 3 };
      if (settings.budget !== "any") {
        var dishB = bOrder[dish.budget] || 2;
        if (settings.budget === "under15" && dishB > 1) return false;
        if (settings.budget === "15to30" && dishB > 2) return false;
        if (settings.budget === "over30" && dishB < 2) return false;
      }

      if (settings.channel === "home_cook") {
        if (settings.equipment !== "any") {
          if (!dish.equipment || dish.equipment.indexOf(settings.equipment) === -1) return false;
        }
        // prepTime 为软偏好，不在硬条件里
      }

      var tags = settings.tags || {};
      if (tags.noSpicy && dish.spicy > 0) return false;
      if (tags.noBeef && (dish.allergens.indexOf("beef") !== -1 || dish.protein === "牛肉")) return false;
      if (tags.noPork && (dish.allergens.indexOf("pork") !== -1 || dish.protein === "猪肉")) return false;
      if (tags.noSeafood && dish.allergens.indexOf("seafood") !== -1) return false;
      if (tags.noEgg && dish.allergens.indexOf("egg") !== -1) return false;
      if (tags.noMilk && dish.allergens.indexOf("milk") !== -1) return false;
      if (tags.noNuts && dish.allergens.indexOf("nuts") !== -1) return false;

      if (settings.goal === "ovo_lacto") {
        var meat = ["鸡肉", "猪肉", "牛肉", "虾", "鱼"];
        if (meat.indexOf(dish.protein) !== -1) return false;
        if (dish.allergens.indexOf("seafood") !== -1 || dish.allergens.indexOf("beef") !== -1 || dish.allergens.indexOf("pork") !== -1) return false;
      }

      return true;
    }

    /**
     * softFlags: 哪些软偏好仍启用
     * { scene, goal, hunger, tastes, wait, prep }
     */
    function matchSoftFilters(dish, settings, softFlags) {
      softFlags = softFlags || defaultSoftFlags();
      if (softFlags.scene && dish.scenes.indexOf(settings.scene) === -1) return false;
      if (softFlags.goal && settings.goal !== "ovo_lacto" && settings.goal !== "casual") {
        if (dish.goals.indexOf(settings.goal) === -1) return false;
      } else if (softFlags.goal && settings.goal === "casual") {
        // 随心吃：不硬卡
      }
      if (softFlags.hunger && dish.hunger.indexOf(settings.hunger) === -1) return false;
      if (softFlags.tastes && settings.tastes && settings.tastes.length) {
        var ok = settings.tastes.some(function (t) { return dish.tasteTags.indexOf(t) !== -1; });
        if (!ok) return false;
      }
      if (softFlags.wait && settings.channel === "takeout" && settings.waitTime !== "any") {
        var wl = parseInt(settings.waitTime, 10);
        if (dish.takeoutWait == null || dish.takeoutWait > wl) return false;
      }
      if (softFlags.prep && settings.channel === "home_cook" && settings.prepTime !== "any") {
        var pl = parseInt(settings.prepTime, 10);
        if (dish.prepMinutes == null || dish.prepMinutes > pl) return false;
      }
      return true;
    }

    function defaultSoftFlags() {
      return { scene: true, goal: true, hunger: true, tastes: true, wait: true, prep: true };
    }

    function softFlagLabel(key, settings) {
      if (key === "scene") return SCENE_LABEL[settings.scene] || "场景";
      if (key === "goal") return GOAL_LABEL[settings.goal] || "目标";
      if (key === "hunger") return HUNGER_LABEL[settings.hunger] || "胃口";
      if (key === "tastes") {
        if (!settings.tastes || !settings.tastes.length) return "口味";
        return settings.tastes.map(function (t) { return TASTE_LABEL[t] || t; }).join("、");
      }
      if (key === "wait") return settings.waitTime === "any" ? "等待时间" : (settings.waitTime + "分钟内");
      if (key === "prep") return settings.prepTime === "any" ? "做饭时间" : (settings.prepTime + "分钟");
      return key;
    }

    function matchFilters(dish, settings, meal, softFlags) {
      return matchHardFilters(dish, settings, meal) && matchSoftFilters(dish, settings, softFlags);
    }

    function weightDish(dish, settings, ctx, rng) {
      var w = 1 + rng() * 0.4;

      if (ctx.eatenMap[dish.id]) w *= 1 / (1 + ctx.eatenMap[dish.id] * 1.8);
      if (ctx.sessionMealSeen[dish.id]) w *= 0.45;
      if (ctx.excludeIds[dish.id]) w = 0;
      if (ctx.usedIds[dish.id]) w = 0;
      if (ctx.usedStaple[dish.staple] && dish.staple !== "无主食") w *= 0.06;
      if (ctx.usedProtein[dish.protein]) w *= 0.1;

      // 软偏好加分（即使未硬过滤也偏好匹配）
      if (dish.scenes.indexOf(settings.scene) !== -1) w += 0.35;
      if (dish.goals.indexOf(settings.goal) !== -1) w += 0.3;
      if (dish.hunger.indexOf(settings.hunger) !== -1) w += 0.25;
      if (settings.tastes && settings.tastes.length) {
        var hit = settings.tastes.filter(function (t) { return dish.tasteTags.indexOf(t) !== -1; }).length;
        w += hit * 0.2;
      }
      if (settings.goal === "light") {
        if (dish.fullness === 0) w += 0.2;
        if (dish.fullness === 2) w -= 0.08;
      }
      if (settings.goal === "high_protein") {
        if (["鸡肉", "牛肉", "虾", "鱼", "鸡蛋", "豆腐", "乳制品"].indexOf(dish.protein) !== -1) w += 0.25;
      }
      if (settings.hunger === "starving" && dish.fullness === 2) w += 0.25;
      if (settings.hunger === "low" && dish.fullness === 0) w += 0.2;
      if (settings.scene === "overtime" && (dish.channels.indexOf("takeout") !== -1 || dish.channels.indexOf("convenience") !== -1)) w += 0.15;
      if (settings.scene === "post_workout" && dish.goals.indexOf("high_protein") !== -1) w += 0.15;

      return Math.max(0, w);
    }

    /** 逐步放宽软偏好，返回 { softFlags, relaxed: [keys] } */
    function resolveSoftFlags(settings, meal, excludeMap) {
      var order = ["tastes", "wait", "prep", "hunger", "scene", "goal"];
      var flags = defaultSoftFlags();
      var relaxed = [];

      function poolSize(f) {
        return DISHES.filter(function (d) {
          return matchFilters(d, settings, meal, f) && !(excludeMap && excludeMap[d.id]);
        }).length;
      }

      if (poolSize(flags) > 0) return { softFlags: flags, relaxed: relaxed };

      for (var i = 0; i < order.length; i++) {
        var key = order[i];
        // 跳过未设置的软条件
        if (key === "tastes" && (!settings.tastes || !settings.tastes.length)) continue;
        if (key === "wait" && (settings.channel !== "takeout" || settings.waitTime === "any")) continue;
        if (key === "prep" && (settings.channel !== "home_cook" || settings.prepTime === "any")) continue;
        if (key === "goal" && (settings.goal === "casual" || settings.goal === "ovo_lacto")) continue;

        flags[key] = false;
        relaxed.push(key);
        if (poolSize(flags) > 0) break;
      }
      return { softFlags: flags, relaxed: relaxed };
    }

    function pickWeighted(candidates, scoreFn, rng) {
      if (!candidates.length) return null;
      var total = 0;
      var scores = candidates.map(function (d) {
        var s = scoreFn(d);
        total += s;
        return s;
      });
      if (total <= 0) return candidates[Math.floor(rng() * candidates.length)] || null;
      var r = rng() * total;
      for (var i = 0; i < candidates.length; i++) {
        r -= scores[i];
        if (r <= 0) return candidates[i];
      }
      return candidates[candidates.length - 1];
    }

    /**
     * 生成计划
     * options:
     *  - fixedMeals: {breakfast:id,...} 保持不变
     *  - excludePerMeal: {lunch: {id:true}}
     *  - mustDifferMeals: {breakfast:id,...} 该餐必须不同于
     *  - forbidSignatures: [sig,...]
     *  - seedSalt: string
     */
    function generatePlan(settings, options) {
      options = options || {};
      var fixed = options.fixedMeals || {};
      var excludePerMeal = options.excludePerMeal || {};
      var mustDiffer = options.mustDifferMeals || {};
      var forbidSigs = {};
      (options.forbidSignatures || []).forEach(function (s) { forbidSigs[s] = true; });

      var eatenMap = eatenDishWeightMap();
      var sessionMealSeen = options.sessionMealSeen || {};
      var best = null;
      var allRelaxed = {};

      // 预先为每餐解析软偏好放宽
      var mealSoft = {};
      MEALS.forEach(function (meal) {
        if (fixed[meal]) return;
        var excl = Object.assign({}, excludePerMeal[meal] || {});
        if (mustDiffer[meal]) excl[mustDiffer[meal]] = true;
        var resolved = resolveSoftFlags(settings, meal, excl);
        mealSoft[meal] = resolved;
        resolved.relaxed.forEach(function (k) { allRelaxed[k] = true; });
      });

      for (var attempt = 0; attempt < 24; attempt++) {
        var seed = hashStr(
          todayKey() + "#" + JSON.stringify(settings) + "#" + (options.seedSalt || "") + "#a" + attempt + "#" + Date.now() + "#" + Math.random()
        );
        var usedIds = {};
        var usedStaple = {};
        var usedProtein = {};
        var meals = {};
        var empty = [];

        MEALS.forEach(function (meal, idx) {
          if (fixed[meal]) {
            meals[meal] = fixed[meal];
            var keep = dishById(fixed[meal]);
            if (keep) {
              usedIds[keep.id] = true;
              if (keep.staple !== "无主食") usedStaple[keep.staple] = true;
              usedProtein[keep.protein] = true;
            }
            return;
          }

          var rng = mulberry32(hashStr(String(seed) + "#" + meal + "#" + idx));
          var exclude = Object.assign({}, excludePerMeal[meal] || {});
          if (mustDiffer[meal]) exclude[mustDiffer[meal]] = true;

          var softFlags = (mealSoft[meal] && mealSoft[meal].softFlags) || defaultSoftFlags();
          var pool = DISHES.filter(function (d) {
            return matchFilters(d, settings, meal, softFlags) && !exclude[d.id];
          });

          // 硬条件兜底：只剩硬筛选
          if (!pool.length) {
            pool = DISHES.filter(function (d) {
              return matchHardFilters(d, settings, meal) && !exclude[d.id];
            });
            if (pool.length) {
              Object.keys(defaultSoftFlags()).forEach(function (k) { allRelaxed[k] = true; });
            }
          }

          if (!pool.length) {
            empty.push(meal);
            meals[meal] = null;
            return;
          }

          var ctx = {
            eatenMap: eatenMap,
            sessionMealSeen: sessionMealSeen,
            excludeIds: exclude,
            usedIds: usedIds,
            usedStaple: usedStaple,
            usedProtein: usedProtein
          };

          var picked = pickWeighted(pool, function (d) {
            return weightDish(d, settings, ctx, rng);
          }, rng);

          if (!picked || usedIds[picked.id]) {
            ctx.usedStaple = {};
            ctx.usedProtein = {};
            picked = pickWeighted(pool, function (d) {
              return weightDish(d, settings, ctx, rng);
            }, rng);
          }

          if (!picked) {
            empty.push(meal);
            meals[meal] = null;
            return;
          }

          meals[meal] = picked.id;
          usedIds[picked.id] = true;
          if (picked.staple !== "无主食") usedStaple[picked.staple] = true;
          usedProtein[picked.protein] = true;
        });

        var sig = makeSignature(meals);
        var plan = {
          meals: meals,
          signature: sig,
          emptyMeals: empty,
          anyEmpty: empty.length > 0,
          filters: snapshotFilters(settings),
          relaxedKeys: Object.keys(allRelaxed),
          ts: Date.now()
        };

        if (plan.anyEmpty) {
          if (!best) best = plan;
          continue;
        }

        if (forbidSigs[sig] && attempt < 20) continue;

        if (options.requireAllMealsDifferent && options.prevMeals) {
          var allDiff = MEALS.every(function (m) {
            return !options.prevMeals[m] || meals[m] !== options.prevMeals[m];
          });
          if (!allDiff) {
            if (options.prevSignature && sig === options.prevSignature && attempt < 18) continue;
            var sameCount = MEALS.filter(function (m) {
              return options.prevMeals[m] && meals[m] === options.prevMeals[m];
            }).length;
            if (sameCount > 0 && attempt < 12) continue;
          }
        }

        return plan;
      }

      return best || {
        meals: { breakfast: null, lunch: null, dinner: null },
        signature: "||",
        emptyMeals: MEALS.slice(),
        anyEmpty: true,
        filters: snapshotFilters(settings),
        relaxedKeys: Object.keys(allRelaxed),
        ts: Date.now()
      };
    }

    function menuFromPlan(plan, action) {
      var names = {};
      MEALS.forEach(function (m) {
        var d = plan.meals[m] ? dishById(plan.meals[m]) : null;
        names[m] = d ? d.name : "";
      });
      return {
        id: uid(),
        ts: Date.now(),
        action: action,
        filters: plan.filters || snapshotFilters(state.settings),
        meals: {
          breakfast: plan.meals.breakfast,
          lunch: plan.meals.lunch,
          dinner: plan.meals.dinner
        },
        names: names,
        signature: plan.signature || makeSignature(plan.meals),
        relaxedKeys: plan.relaxedKeys || []
      };
    }

    /* ---------- 6. 状态与独立动作函数 ---------- */
    var state = {
      settings: loadSettings(),
      menu: null,           // 当前完整菜单对象
      revealing: false,
      historyTab: "recommend",
      sessionSeenSigs: {},
      sessionMealSeen: {}
    };

    /** 仅恢复缓存显示，不写历史 */
    function restoreLastMenu() {
      var saved = loadCurrentMenu();
      if (saved && saved.meals && (saved.meals.breakfast || saved.meals.lunch || saved.meals.dinner)) {
        state.menu = saved;
        // 同步会话防重
        if (saved.signature) state.sessionSeenSigs[saved.signature] = true;
        MEALS.forEach(function (m) {
          if (saved.meals[m]) state.sessionMealSeen[saved.meals[m]] = true;
        });
        renderResults({ animate: false });
        updateArrangeButton();
        return true;
      }
      state.menu = null;
      renderResults({ animate: false });
      updateArrangeButton();
      return false;
    }

    /** 点击主按钮：必须生成新菜单 */
    function generateNewMenu() {
      var settings = state.settings;
      saveSettings(settings);

      var forbid = recentSignatures(20);
      Object.keys(state.sessionSeenSigs).forEach(function (s) { forbid.push(s); });
      if (state.menu && state.menu.signature) forbid.push(state.menu.signature);

      var isFirst = !hasArrangedBefore() && !state.menu;
      var action = isFirst ? "first" : "reroll";

      var plan = generatePlan(settings, {
        forbidSignatures: forbid,
        seedSalt: "gen-" + Date.now() + "-" + Math.random(),
        sessionMealSeen: state.sessionMealSeen,
        prevMeals: state.menu ? state.menu.meals : null,
        prevSignature: state.menu ? state.menu.signature : null,
        requireAllMealsDifferent: !!state.menu,
        mustDifferMeals: state.menu ? {
          breakfast: state.menu.meals.breakfast,
          lunch: state.menu.meals.lunch,
          dinner: state.menu.meals.dinner
        } : {}
      });

      if (plan.anyEmpty && !plan.meals.breakfast && !plan.meals.lunch && !plan.meals.dinner) {
        // 生成失败：保留上一份菜单，只展示友好提示
        renderNoMatchState();
        toast("筛选有点严，换个条件试试");
        return;
      }

      var menu = menuFromPlan(plan, action);
      applyMenu(menu, {
        recordHistory: true,
        animate: true,
        collapseFilters: true,
        scrollToResults: true,
        toastMsg: action === "first" ? "三顿饭安排好啦" : "换好一组新的"
      });
      markArranged();
      updateArrangeButton();
    }

    /** 全部换一组：每餐尽量与上一组不同 */
    function rerollAllMeals() {
      if (!state.menu) {
        generateNewMenu();
        return;
      }
      var settings = state.settings;
      var forbid = recentSignatures(20);
      Object.keys(state.sessionSeenSigs).forEach(function (s) { forbid.push(s); });
      forbid.push(state.menu.signature);

      var plan = generatePlan(settings, {
        forbidSignatures: forbid,
        seedSalt: "reroll-" + Date.now(),
        sessionMealSeen: state.sessionMealSeen,
        prevMeals: state.menu.meals,
        prevSignature: state.menu.signature,
        requireAllMealsDifferent: true,
        mustDifferMeals: {
          breakfast: state.menu.meals.breakfast,
          lunch: state.menu.meals.lunch,
          dinner: state.menu.meals.dinner
        }
      });

      if (plan.anyEmpty && !plan.meals.breakfast && !plan.meals.lunch && !plan.meals.dinner) {
        renderNoMatchState();
        return;
      }

      var menu = menuFromPlan(plan, "reroll");
      applyMenu(menu, {
        recordHistory: true,
        animate: true,
        collapseFilters: true,
        scrollToResults: true,
        toastMsg: "已换一组新的三餐"
      });
    }

    /** 单餐换菜：另两顿固定 */
    function swapOneMeal(meal) {
      if (!state.menu) {
        generateNewMenu();
        return;
      }
      var settings = state.settings;
      var fixed = {};
      MEALS.forEach(function (m) {
        if (m !== meal) fixed[m] = state.menu.meals[m];
      });

      var exclude = {};
      exclude[meal] = {};
      if (state.menu.meals[meal]) exclude[meal][state.menu.meals[meal]] = true;
      // 优先排除该餐最近 5 次
      recentMealDishIds(meal, 5).forEach(function (id) {
        exclude[meal][id] = true;
      });

      var forbid = recentSignatures(20);
      Object.keys(state.sessionSeenSigs).forEach(function (s) { forbid.push(s); });

      var plan = generatePlan(settings, {
        fixedMeals: fixed,
        excludePerMeal: exclude,
        forbidSignatures: forbid,
        seedSalt: "swap-" + meal + "-" + Date.now(),
        sessionMealSeen: state.sessionMealSeen,
        mustDifferMeals: (function () {
          var o = {};
          o[meal] = state.menu.meals[meal];
          return o;
        })()
      });

      // 若排除过严导致该餐为空，放宽最近5次限制只排除当前
      if (!plan.meals[meal]) {
        exclude = {};
        exclude[meal] = {};
        if (state.menu.meals[meal]) exclude[meal][state.menu.meals[meal]] = true;
        plan = generatePlan(settings, {
          fixedMeals: fixed,
          excludePerMeal: exclude,
          forbidSignatures: forbid,
          seedSalt: "swap-relax-" + meal + "-" + Date.now(),
          sessionMealSeen: state.sessionMealSeen
        });
      }

      if (!plan.meals[meal]) {
        toast("这顿暂时没有更多候选，试试放宽筛选");
        return;
      }

      var action = "swap_" + meal;
      var menu = menuFromPlan(plan, action);
      applyMenu(menu, { recordHistory: true, animate: false, swapMeal: meal, toastMsg: MEAL_LABEL[meal] + "已换好" });
    }

    /** 应用菜单到界面；recordHistory 控制是否写入推荐历史 */
    function applyMenu(menu, opts) {
      opts = opts || {};
      state.menu = menu;
      saveCurrentMenu(menu);

      if (menu.signature) state.sessionSeenSigs[menu.signature] = true;
      MEALS.forEach(function (m) {
        if (menu.meals[m]) state.sessionMealSeen[menu.meals[m]] = true;
      });

      if (opts.recordHistory) {
        pushRecommendHistory({
          id: menu.id,
          ts: menu.ts || Date.now(),
          action: menu.action,
          filters: menu.filters,
          meals: menu.meals,
          names: menu.names,
          signature: menu.signature
        });
      }

      renderResults({
        animate: opts.animate,
        swapMeal: opts.swapMeal,
        collapseFilters: opts.collapseFilters,
        scrollToResults: opts.scrollToResults
      });
      if (opts.toastMsg) toast(opts.toastMsg);
    }

    /** 恢复某条历史：只改显示，不新增历史 */
    function restoreHistoryEntry(entry) {
      if (!entry || !entry.meals) return;
      var menu = {
        id: entry.id || uid(),
        ts: Date.now(),
        action: "restore",
        filters: entry.filters || snapshotFilters(state.settings),
        meals: {
          breakfast: entry.meals.breakfast,
          lunch: entry.meals.lunch,
          dinner: entry.meals.dinner
        },
        names: entry.names || {},
        signature: entry.signature || makeSignature(entry.meals)
      };
      // 若 names 缺失则补全
      MEALS.forEach(function (m) {
        if (!menu.names[m] && menu.meals[m]) {
          var d = dishById(menu.meals[m]);
          menu.names[m] = d ? d.name : "";
        }
      });
      applyMenu(menu, { recordHistory: false, animate: false, toastMsg: "已恢复这一组" });
      updateArrangeButton();
      closeHistoryDrawer();
    }

    function markEatenToday() {
      if (!state.menu || !state.menu.meals) {
        toast("先安排一套菜单吧");
        return;
      }
      var list = loadEatenHistory();
      list.push({
        id: uid(),
        ts: Date.now(),
        date: todayKey(),
        meals: state.menu.meals,
        names: state.menu.names,
        signature: state.menu.signature,
        filters: state.menu.filters
      });
      saveEatenHistory(list);
      toast("记下啦，今天就吃这套");
      if (state.historyTab === "eaten") renderHistoryDrawerBody();
    }

    function updateArrangeButton() {
      var text = (hasArrangedBefore() || state.menu)
        ? "这组不对胃口，再来一组"
        : "帮我安排今天三顿饭";
      var stickyText = (hasArrangedBefore() || state.menu)
        ? "不对胃口，再来一组"
        : "帮我安排今天三顿饭";
      var btn = $("#btnArrange");
      var sticky = $("#btnArrangeSticky");
      if (btn) btn.textContent = text;
      if (sticky) sticky.textContent = stickyText;
    }

    function isMobileLayout() {
      return window.matchMedia("(max-width: 767px)").matches;
    }

    function countExtraSelections() {
      var s = state.settings;
      var n = 0;
      if (s.hunger && s.hunger !== "normal") n++;
      if (s.tastes && s.tastes.length) n += s.tastes.length;
      if (s.budget && s.budget !== "any") n++;
      if (s.channel === "takeout" && s.waitTime !== "any") n++;
      if (s.channel === "home_cook") {
        if (s.equipment !== "any") n++;
        if (s.prepTime !== "any") n++;
      }
      Object.keys(s.tags || {}).forEach(function (k) { if (s.tags[k]) n++; });
      return n;
    }

    function updateMoreSummary() {
      var el = $("#morePanelSummary");
      if (!el) return;
      var n = countExtraSelections();
      el.textContent = n > 0 ? ("⚙️ 更多条件 · 已选择" + n + "项") : "⚙️ 更多条件";
    }

    function updateFilterSummaryText() {
      var s = state.settings;
      var parts = [
        SCENE_LABEL[s.scene] || s.scene,
        CHANNEL_LABEL[s.channel] || (s.channel === "any" ? "都可以" : s.channel),
        GOAL_LABEL[s.goal] || s.goal
      ];
      $("#filterSummaryText").textContent = parts.join(" · ");
    }

    function setFilterCollapsed(collapsed) {
      var panel = $("#filterPanel");
      if (!panel) return;
      if (collapsed && isMobileLayout() && state.menu) {
        panel.classList.add("is-collapsed");
        updateFilterSummaryText();
      } else {
        panel.classList.remove("is-collapsed");
      }
    }

    /** 手机：把 secondaryFilters 移入更多条件；桌面还原 */
    function layoutSecondaryFilters() {
      var secondary = $("#secondaryFilters");
      var moreBody = $("#moreBody");
      var filterFull = $("#filterFull");
      var morePanel = $("#morePanel");
      var actions = filterFull && filterFull.querySelector(".filter-actions");
      if (!secondary || !moreBody || !filterFull) return;

      if (isMobileLayout()) {
        if (secondary.parentElement !== moreBody) moreBody.appendChild(secondary);
        secondary.classList.remove("filter-grid");
        secondary.style.display = "grid";
        secondary.style.gap = "0.85rem";
        if (morePanel) morePanel.hidden = false;
      } else {
        if (actions && secondary.parentElement !== filterFull) {
          filterFull.insertBefore(secondary, actions);
        } else if (secondary.parentElement !== filterFull) {
          filterFull.appendChild(secondary);
        }
        secondary.classList.add("filter-grid");
        secondary.style.display = "";
        secondary.style.gap = "";
        if (morePanel) morePanel.hidden = true;
        setFilterCollapsed(false);
      }
      updateMoreSummary();
    }

    function showSoftenNotice(keys, settings) {
      var box = $("#softenNotice");
      if (!box) return;
      if (!keys || !keys.length) {
        box.hidden = true;
        box.textContent = "";
        return;
      }
      // 过滤未实际生效的
      var labels = [];
      var seen = {};
      keys.forEach(function (k) {
        if (k === "tastes" && (!settings.tastes || !settings.tastes.length)) return;
        if (k === "wait" && (settings.channel !== "takeout" || settings.waitTime === "any")) return;
        if (k === "prep" && (settings.channel !== "home_cook" || settings.prepTime === "any")) return;
        if (k === "goal" && (settings.goal === "casual" || settings.goal === "ovo_lacto")) return;
        var lab = softFlagLabel(k, settings);
        if (!seen[lab]) { seen[lab] = true; labels.push(lab); }
      });
      if (!labels.length) {
        box.hidden = true;
        return;
      }
      box.hidden = false;
      box.innerHTML = "<strong>已为你放宽：</strong>" + escapeHtml(labels.join("、")) + "；忌口条件保持不变。";
    }

    /* ---------- 7. UI ---------- */

      });

        b.setAttribute("aria-checked", b.getAttribute("data-channel") === s.channel ? "true" : "false");
      });
      $all("#hungerGroup .chip").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-hunger") === s.hunger ? "true" : "false");
      });
      $all("#budgetGroup .chip").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-budget") === s.budget ? "true" : "false");
      });
      $all("#tasteGroup .chip").forEach(function (b) {
        var t = b.getAttribute("data-taste");
        b.setAttribute("aria-pressed", s.tastes.indexOf(t) !== -1 ? "true" : "false");
      });
      $all("#equipGroup .chip").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-equip") === s.equipment ? "true" : "false");
      });
      $all("#prepGroup .chip").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-prep") === s.prepTime ? "true" : "false");
      });
      $all("#waitGroup .chip").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-wait") === s.waitTime ? "true" : "false");
      });
      $all("#tagGroup .chip").forEach(function (b) {
        var tag = b.getAttribute("data-tag");
        b.setAttribute("aria-pressed", s.tags[tag] ? "true" : "false");
      });

      $("#homeCookExtras").hidden = s.channel !== "home_cook";
      $("#takeoutExtras").hidden = s.channel !== "takeout";
      var hint = $("#modeHint");
      if (hint) hint.textContent = SCENE_HINT[s.scene] || "今天已经做了很多决定，吃什么就交给我吧。";
      updateMoreSummary();
      updateFilterSummaryText();
    }

    function renderMetaHeader() {
      var now = new Date();
      $("#todayDate").textContent = formatChineseDate(now);
      $("#greeting").textContent = greetingByHour(now.getHours());
    }

    function metaItem(k, v) {
      return '<div class="meta-item"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>";
    }

    function primaryChannel(dish) {
      return dish.channels[0] || "takeout";
    }

    function timeMeta(dish) {
      var ch = primaryChannel(dish);
      if (ch === "home_cook" && dish.prepMinutes != null) return "做约 " + dish.prepMinutes + " 分钟";
      if (ch === "takeout" && dish.takeoutWait != null) return "等约 " + dish.takeoutWait + " 分钟";
      if (ch === "convenience") return "即取即食";
      if (ch === "canteen") return "食堂现取";
      return "—";
    }

    function renderPlaceholder() {
      return (
        '<div class="buddy">' +
          '<div class="buddy-face" aria-hidden="true">🦊</div>' +
          '<div class="buddy-text"><strong>饭饭还在等指令</strong><br/>选好场景和目标，点下方主按钮，三顿饭会依次揭晓～</div>' +
        "</div>" +
        '<div class="meal-list">' +
          placeholderCard("breakfast", "早餐还空着", "豆浆、粥、三明治…随你挑") +
          placeholderCard("lunch", "午餐待揭晓", "盖饭、轻食、食堂小炒") +
          placeholderCard("dinner", "晚餐待揭晓", "热汤、炒菜或便利店也行") +
        "</div>"
      );
    }

    function placeholderCard(meal, title, sub) {
      return (
        '<article class="meal-card is-placeholder is-shown" data-meal="' + meal + '">' +
          '<div class="ph-emoji" aria-hidden="true">' + MEAL_EMOJI[meal] + "</div>" +
          '<div class="ph-text"><strong>' + title + "</strong><span>" + sub + "</span></div>" +
        "</article>"
      );

    function renderCard(meal, dish, animate) {
      if (!dish) {
        return (
          '<article class="meal-card is-shown" data-meal="' + meal + '">' +
          '<div class="meal-top"><div class="food-visual"><span class="emoji">🤔</span></div>' +

        );
      }

      var url = (ch === "home_cook") ? recipeUrl(dish) : "";
      var recipeBtn = url
        ? '<a class="btn btn-link btn-sm" href="' + url + '" target="_blank" rel="noopener noreferrer">查看食谱</a>'
        : "";

          (dish.orderTip ? '<div class="tip-box"><strong>点单提示 · </strong>' + escapeHtml(dish.orderTip) + "</div>" : "");
      } else if (ch === "canteen") {

          '<div class="search-row"><span>档口关键词</span><code>' + escapeHtml(dish.canteenKeyword || "综合窗口") + "</code></div>";
      } else if (ch === "convenience") {
        extraRows =
          '<div class="search-row"><span>组合提示</span><code>' + escapeHtml(dish.orderTip || dish.searchQuery || "便利店加热即食") + "</code></div>";
      } else if (ch === "home_cook") {
        extraRows =
          '<div class="tip-box"><strong>小贴士 · </strong>' + escapeHtml(dish.tip) + "</div>";
      }

      if (ch !== "home_cook" && dish.tip) {
        extraRows += '<div class="tip-box"><strong>小贴士 · </strong>' + escapeHtml(dish.tip) + "</div>";
      }

      var cls = "meal-card" + (animate ? "" : " is-shown");
      return (
        '<article class="' + cls + '" data-meal="' + meal + '" data-id="' + dish.id + '">' +
        '<div class="meal-top">' +
          '<div class="food-visual" aria-hidden="true"><span class="plate"></span><span class="emoji">' + dish.emoji + "</span></div>" +
          '<div class="meal-info">' +
            '<span class="meal-badge">' + MEAL_EMOJI[meal] + " " + MEAL_LABEL[meal] +
            '<span class="channel-pill">' + (CHANNEL_LABEL[ch] || ch) + "</span></span>" +
            '<h3 class="meal-name">' + escapeHtml(dish.name) + "</h3>" +
            '<p class="meal-reason">' + escapeHtml(dish.reason) + "</p>" +
          "</div>" +
        "</div>" +

          metaItem("难度", DIFF_LABEL[dish.difficulty] || "一般") +

          metaItem("饱腹感", FILL_LABEL[dish.fullness] || "适中") +
