<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="今日宜 · 学习任务池与专注计时" />
  <meta name="theme-color" content="#FF6B57" />
  <title>宜学习 · 今日宜</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/home.css" />
  <link rel="stylesheet" href="./assets/css/modules.css" />
  <link rel="stylesheet" href="./assets/css/responsive.css" />
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-c"></div>
  </div>
  <div class="page">
    <div class="app-nav" id="appNav"></div>

    <header class="mod-page-head">
      <h1>宜学习</h1>
      <p>自己的任务池 + 15/25/45 分钟计时 · 完成会记入今日宜</p>
    </header>

    <section class="mod-panel" aria-label="专注计时器">
      <h2>专注计时</h2>
      <p class="timer-task-label" id="timerTaskLabel">未绑定任务 · 也可纯计时</p>
      <div class="timer-box">
        <div class="timer-display" id="timerDisplay" aria-live="polite">25:00</div>
        <div class="timer-presets" role="group" aria-label="时长预设">
          <button type="button" class="chip" data-timer-min="15" aria-pressed="false">15 分钟</button>
          <button type="button" class="chip" data-timer-min="25" aria-pressed="true">25 分钟</button>
          <button type="button" class="chip" data-timer-min="45" aria-pressed="false">45 分钟</button>
        </div>
        <div class="timer-controls">
          <button type="button" class="btn btn-primary" id="btnTimerStart" style="width:auto">开始</button>
          <button type="button" class="btn btn-secondary" id="btnTimerPause" style="width:auto" hidden>暂停</button>
          <button type="button" class="btn btn-ghost" id="btnTimerReset" style="width:auto">重置</button>
        </div>
      </div>
      <div class="focus-log">
        <div id="focusSummary">今日专注约 0 分钟</div>
        <ul id="focusLogList" style="margin:0.4rem 0 0;padding-left:1.1rem"></ul>
      </div>
    </section>

    <section class="mod-panel" aria-label="我的任务池">
      <h2>我的任务池</h2>
      <div class="task-form">
        <div class="form-row">
          <label for="taskTitle">任务名称</label>
          <input type="text" id="taskTitle" maxlength="80" placeholder="例如：复习线性代数第三章" autocomplete="off" />
        </div>
        <div class="form-row">
          <label for="taskMinutes">预计分钟</label>
          <input type="number" id="taskMinutes" min="1" max="180" value="25" inputmode="numeric" />
        </div>
        <div class="form-row">
          <label for="taskNote">备注 / 完成标准（可选）</label>
          <textarea id="taskNote" maxlength="200" placeholder="例如：做完习题 1～5 并订正"></textarea>
        </div>
        <button type="button" class="btn btn-secondary" id="btnAddTask">添加到任务池</button>
      </div>
      <div id="taskList"></div>
    </section>

    <section class="mod-panel" aria-label="今日学习动作">
      <h2>今日学习动作建议</h2>
      <p class="hint" style="margin-top:0">来自内置动作库，可加入任务池或直接开始计时</p>
      <div id="studyActions" style="margin-top:0.65rem"></div>
    </section>

    <footer class="site-footer">
      <p>计时与任务仅存本机 · 不会上传</p>
    </footer>
  </div>
  <div class="toast-host" aria-live="assertive"><div class="toast" id="toast" role="status"></div></div>

  <script src="./js/core/utils.js"></script>
  <script src="./js/core/storage.js"></script>
  <script src="./js/core/navigation.js"></script>
  <script src="./js/core/recommendation.js"></script>
  <script src="./js/core/history.js"></script>
  <script src="./js/core/daily-plan.js"></script>
  <script src="./data/draw-prompts.js"></script>
  <script src="./data/study-actions.js"></script>
  <script src="./data/leisure-activities.js"></script>
  <script src="./data/bead-patterns.js"></script>
  <script src="./data/activity-pool.js"></script>
  <script src="./js/modules/study.js"></script>
</body>
</html>
