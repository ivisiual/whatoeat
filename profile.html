<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B57" />
  <title>我的 · 今日宜</title>
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/home.css" />
  <link rel="stylesheet" href="./assets/css/responsive.css" />
  <style>
    .prof-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
    .prof-panel {
      background: rgba(255,255,255,0.88);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: var(--panel-padding);
      min-width: 0;
    }
    .prof-item {
      background: #fff; border: 1.5px solid var(--line);
      border-radius: var(--radius-md); padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem; min-width: 0;
    }
    .prof-item .t { font-weight: 800; color: var(--caramel); font-size: 0.9rem; }
    .prof-item .m { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.2rem; }
    .prof-item .ops { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .backup-panel { margin-top: 1rem; }
    .backup-panel h2 { margin: 0 0 0.3rem; font-size: 1rem; color: var(--caramel); }
    .backup-panel p { margin: 0; }
    .backup-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .backup-actions .btn { flex: 1 1 10rem; }
    .backup-note { margin-top: 0.65rem !important; font-size: 0.75rem; color: var(--ink-soft); }
    #backupStatus { min-height: 1.4em; margin-top: 0.55rem; font-size: 0.78rem; color: var(--avocado-deep); }
  </style>
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>
  <div class="page">
    <div class="app-nav" id="appNav"></div>
    <header class="home-hero">
      <h1>我的</h1>
      <p class="home-sub">完成记录与收藏 · 数据保存在当前浏览器，可随时备份</p>
    </header>

    <div class="prof-tabs" role="tablist">
      <button type="button" class="chip" id="tabHist" role="tab" aria-selected="true" aria-pressed="true">完成历史</button>
      <button type="button" class="chip" id="tabFav" role="tab" aria-selected="false" aria-pressed="false">收藏</button>
    </div>

    <section class="prof-panel" id="panelHist" aria-label="完成历史"></section>
    <section class="prof-panel" id="panelFav" aria-label="收藏" hidden></section>

    <section class="prof-panel backup-panel" aria-labelledby="backupTitle">
      <h2 id="backupTitle">数据备份</h2>
      <p class="hint">换设备或清理浏览器前，先导出一份 JSON 备份。导入会用备份内容替换当前数据。</p>
      <div class="backup-actions">
        <button type="button" class="btn btn-secondary" id="btnExportData">导出我的数据</button>
        <button type="button" class="btn btn-ghost" id="btnImportData">从备份导入</button>
      </div>
      <input type="file" id="backupFile" accept="application/json,.json" hidden />
      <p id="backupStatus" role="status" aria-live="polite"></p>
      <p class="backup-note">备份包含收藏、完成历史、学习任务、拼豆进度、三餐与热量记录，请妥善保管。</p>
    </section>

    <p class="hint" style="margin-top:1rem">
      饭饭搭子的推荐历史与热量仍在
      <a href="./eat.html">宜吃饭</a>
      页面内查看；导出备份时会一起包含。
    </p>
    <footer class="site-footer"><p>今日宜 · 我的</p></footer>
  </div>
  <div class="toast-host" aria-live="assertive"><div class="toast" id="toast" role="status"></div></div>

  <script src="./js/core/utils.js"></script>
  <script src="./js/core/storage.js"></script>
  <script src="./js/core/navigation.js"></script>
  <script src="./js/core/history.js"></script>
  <script>
    (function () {
      var u = TodayYi.utils;
      var H = TodayYi.history;
      TodayYi.navigation.renderNav("#appNav");

      function showTab(which) {
        var hist = which === "hist";
        document.getElementById("panelHist").hidden = !hist;
        document.getElementById("panelFav").hidden = hist;
        document.getElementById("tabHist").setAttribute("aria-selected", hist ? "true" : "false");
        document.getElementById("tabHist").setAttribute("aria-pressed", hist ? "true" : "false");
        document.getElementById("tabFav").setAttribute("aria-selected", !hist ? "true" : "false");
        document.getElementById("tabFav").setAttribute("aria-pressed", !hist ? "true" : "false");
      }

      function renderHist() {
        var list = (TodayYi.storage.getActivityHistory() || []).slice().reverse();
        var box = document.getElementById("panelHist");
        if (!list.length) {
          box.innerHTML = '<p class="hint">还没有完成记录。回首页点「完成」，或在宜吃饭打卡三餐。</p>';
          return;
        }
        box.innerHTML = list.map(function (h) {
          return (
            '<article class="prof-item">' +
              '<div class="t">' + u.escapeHtml(h.title || h.activityId) + "</div>" +
              '<div class="m">' + u.escapeHtml(H.categoryLabel(h.category)) +
              " · " + u.escapeHtml(h.date || "") +
              " · " + u.escapeHtml(u.formatRelativeTime(h.completedAt || Date.now())) +
              (h.duration != null ? " · " + h.duration + " 分钟" : "") +
              "</div>" +
              '<div class="ops">' +
                '<button type="button" class="btn btn-ghost btn-sm btn-del-h" data-id="' +
                u.escapeHtml(h.id) + '">删除</button>' +
              "</div></article>"
          );
        }).join("");
        Array.prototype.slice.call(box.querySelectorAll(".btn-del-h")).forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("删除这条记录？")) return;
            H.removeHistory(btn.getAttribute("data-id"));
            renderHist();
            u.toast("已删除");
          });
        });
      }

      function renderFav() {
        var list = H.listFavorites().slice().reverse();
        var box = document.getElementById("panelFav");
        if (!list.length) {
          box.innerHTML = '<p class="hint">还没有收藏。在首页给主签或顺手建议点「收藏」。</p>';
          return;
        }
        box.innerHTML = list.map(function (f) {
          return (
            '<article class="prof-item">' +
              '<div class="t">' + u.escapeHtml(f.title || f.activityId) + "</div>" +
              '<div class="m">' + u.escapeHtml(H.categoryLabel(f.category)) +
              (f.description ? " · " + u.escapeHtml(f.description) : "") +
              "</div>" +
              '<div class="ops">' +
                '<button type="button" class="btn btn-ghost btn-sm btn-unfav" data-id="' +
                u.escapeHtml(f.activityId) + '">取消收藏</button>' +
              "</div></article>"
          );
        }).join("");
        Array.prototype.slice.call(box.querySelectorAll(".btn-unfav")).forEach(function (btn) {
          btn.addEventListener("click", function () {
            H.toggleFavorite({ activityId: btn.getAttribute("data-id") });
            renderFav();
            u.toast("已取消收藏");
          });
        });
      }

      function setBackupStatus(message) {
        document.getElementById("backupStatus").textContent = message || "";
      }

      function exportData() {
        try {
          var backup = TodayYi.storage.createBackup();
          var text = JSON.stringify(backup, null, 2);
          var blob = new Blob([text], { type: "application/json;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "todayyi-backup-" + u.todayKey() + ".json";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          setBackupStatus("已导出 " + Object.keys(backup.data).length + " 项本地数据");
          u.toast("备份已下载");
        } catch (err) {
          setBackupStatus("导出失败：" + (err.message || "未知错误"));
          u.toast("导出失败");
        }
      }

      function importFile(file) {
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
          setBackupStatus("导入失败：文件不能超过 5 MB");
          u.toast("备份文件过大");
          return;
        }
        var reader = new FileReader();
        reader.onerror = function () {
          setBackupStatus("导入失败：无法读取这个文件");
          u.toast("无法读取备份");
        };
        reader.onload = function () {
          try {
            var backup = JSON.parse(String(reader.result || ""));
            var keys = TodayYi.storage.validateBackup(backup);
            var dateText = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString("zh-CN") : "未知时间";
            if (!confirm(
              "将导入 " + keys.length + " 项数据（备份时间：" + dateText + "）。\n\n" +
              "当前浏览器中的今日宜数据会被替换，是否继续？"
            )) {
              setBackupStatus("已取消导入，当前数据没有变化");
              return;
            }
            var result = TodayYi.storage.restoreBackup(backup);
            setBackupStatus("成功导入 " + result.imported + " 项数据，页面即将刷新");
            u.toast("导入成功");
            setTimeout(function () { location.reload(); }, 700);
          } catch (err) {
            setBackupStatus("导入失败：" + (err.message || "文件格式错误"));
            u.toast("导入失败");
          }
        };
        reader.readAsText(file, "utf-8");
      }

      document.getElementById("tabHist").addEventListener("click", function () {
        showTab("hist");
        renderHist();
      });
      document.getElementById("tabFav").addEventListener("click", function () {
        showTab("fav");
        renderFav();
      });
      document.getElementById("btnExportData").addEventListener("click", exportData);
      document.getElementById("btnImportData").addEventListener("click", function () {
        var input = document.getElementById("backupFile");
        input.value = "";
        input.click();
      });
      document.getElementById("backupFile").addEventListener("change", function () {
        importFile(this.files && this.files[0]);
      });
      renderHist();
    })();
  </script>
</body>
</html>
